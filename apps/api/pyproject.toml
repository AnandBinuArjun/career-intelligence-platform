[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-intelligence-api"
version = "1.0.0"
description = "Free, privacy-first ATS optimization and career intelligence API"
authors = [{ name = "Anand B Arjun" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1,<26",
  "PyJWT>=2.9,<3",
  "email-validator>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "boto3>=1.35,<2",
  "pypdf>=5.0,<6",
  "python-docx>=1.1,<2",
  "fpdf2>=2.8,<3",
]

[project.urls]
Homepage = "https://github.com/AnandBinuArjun/career-intelligence-platform"
Repository = "https://github.com/AnandBinuArjun/career-intelligence-platform"
Portfolio = "https://abarjun.online"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
